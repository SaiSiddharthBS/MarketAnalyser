services:
  - type: web
    name: marketpulse-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false # User will set this in Render UI
      - key: TELEGRAM_BOT_TOKEN
        sync: false # User will set this in Render UI
      - key: TELEGRAM_CHAT_ID
        sync: false # User will set this in Render UI
      - key: PYTHON_VERSION
        value: 3.10.12
