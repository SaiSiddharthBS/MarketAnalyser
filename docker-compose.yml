

services:
  market-analyser:
    build: .
    container_name: agent_alpha_bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    environment:
      - TZ=Asia/Kolkata
      - ENVIRONMENT=production
      - ROLE=master_executor
      # Add API keys here if needed
      # - FRED_API_KEY=your_key
      # - TELEGRAM_BOT_TOKEN=your_token
      # - TELEGRAM_CHAT_ID=your_id
