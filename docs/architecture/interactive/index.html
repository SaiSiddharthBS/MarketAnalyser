<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Alpha - Interactive Architecture</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #051114;
            color: #e2e8f0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        #graph-container {
            width: 100vw;
            height: 100vh;
        }
        .node {
            cursor: pointer;
            transition: fill 0.3s, stroke 0.3s;
        }
        .node:hover {
            filter: drop-shadow(0 0 10px currentColor);
        }
        .link {
            stroke-opacity: 0.6;
            transition: stroke-opacity 0.3s, stroke-width 0.3s;
        }
        .node-text {
            pointer-events: none;
            font-size: 12px;
            text-shadow: 0px 2px 4px #000;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            background: rgba(5, 17, 20, 0.8);
            border: 1px solid #38bdf8;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 30px rgba(56, 189, 248, 0.2);
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        #info-title {
            color: #00FF88;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        #info-desc {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .title-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }
        .title-overlay h1 {
            color: #00FF88;
            margin: 0;
            font-size: 24px;
            letter-spacing: 2px;
        }
        .title-overlay p {
            color: #a0aec0;
            margin: 5px 0 0 0;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="title-overlay">
        <h1>AGENT ALPHA</h1>
        <p>Interactive Architecture Topology</p>
    </div>

    <div id="info-panel">
        <div id="info-title">Node Name</div>
        <div id="info-desc">Description of the node goes here.</div>
    </div>

    <div id="graph-container"></div>

    <script>
        const data = {
            nodes: [
                { id: "MacBook", group: 1, color: "#38bdf8", desc: "Executive Dashboard - Primary monitoring node running Obsidian Glass PWA." },
                { id: "Dell_Sentinel", group: 2, color: "#ff3366", desc: "The Sentinel Node - Always-on production server running Docker and the 15-Model Quant Engine." },
                { id: "Docker_Stack", group: 2, color: "#0ea5e9", desc: "Containerized environment on the Sentinel node for absolute parity and stateless compute." },
                { id: "FastAPI", group: 2, color: "#00FF88", desc: "Uvicorn backend serving WebSockets and REST APIs for the UI." },
                { id: "Quant_Engine", group: 2, color: "#00FF88", desc: "15-Model ensemble utilizing XGBoost, LightGBM, and mathematical matrices." },
                { id: "Ollama", group: 2, color: "#f59e0b", desc: "Locally hosted LLaMA 3.3 70B for zero-leakage financial sentiment analysis." },
                { id: "Neon_DB", group: 3, color: "#0ea5e9", desc: "Serverless PostgreSQL cluster for stateless paper trading ledgers and historical logs." },
                { id: "Data_APIs", group: 3, color: "#f59e0b", desc: "yfinance and FRED APIs feeding raw OHLCV and macro data to the engine." },
                { id: "Telegram", group: 3, color: "#38bdf8", desc: "Push notification subsystem for instant Veto and Execution alerts." },
                { id: "Cron_Daemons", group: 2, color: "#ff3366", desc: "Relentless schedulers triggering pre-market, execution, and overnight scans." }
            ],
            links: [
                { source: "MacBook", target: "FastAPI", value: 2 },
                { source: "MacBook", target: "Docker_Stack", value: 1 },
                { source: "Dell_Sentinel", target: "Docker_Stack", value: 5 },
                { source: "Docker_Stack", target: "FastAPI", value: 5 },
                { source: "Docker_Stack", target: "Quant_Engine", value: 5 },
                { source: "Docker_Stack", target: "Cron_Daemons", value: 5 },
                { source: "Quant_Engine", target: "Ollama", value: 3 },
                { source: "Quant_Engine", target: "Neon_DB", value: 4 },
                { source: "Quant_Engine", target: "Data_APIs", value: 4 },
                { source: "Cron_Daemons", target: "Telegram", value: 2 },
                { source: "Cron_Daemons", target: "Quant_Engine", value: 3 }
            ]
        };

        const width = window.innerWidth;
        const height = window.innerHeight;

        const svg = d3.select("#graph-container").append("svg")
            .attr("width", width)
            .attr("height", height);

        const simulation = d3.forceSimulation(data.nodes)
            .force("link", d3.forceLink(data.links).id(d => d.id).distance(150))
            .force("charge", d3.forceManyBody().strength(-800))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collide", d3.forceCollide().radius(60));

        // Glow filter
        const defs = svg.append("defs");
        const filter = defs.append("filter")
            .attr("id", "glow");
        filter.append("feGaussianBlur")
            .attr("stdDeviation", "3.5")
            .attr("result", "coloredBlur");
        const feMerge = filter.append("feMerge");
        feMerge.append("feMergeNode")
            .attr("in", "coloredBlur");
        feMerge.append("feMergeNode")
            .attr("in", "SourceGraphic");

        const link = svg.append("g")
            .attr("class", "links")
            .selectAll("line")
            .data(data.links)
            .enter().append("line")
            .attr("class", "link")
            .attr("stroke", "#475569")
            .attr("stroke-width", d => Math.sqrt(d.value));

        const node = svg.append("g")
            .attr("class", "nodes")
            .selectAll("g")
            .data(data.nodes)
            .enter().append("g")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended))
            .on("mouseover", handleMouseOver)
            .on("mouseout", handleMouseOut);

        node.append("circle")
            .attr("class", "node")
            .attr("r", 20)
            .attr("fill", "#051114")
            .attr("stroke", d => d.color)
            .attr("stroke-width", 3)
            .style("filter", "url(#glow)");

        node.append("text")
            .attr("class", "node-text")
            .attr("dx", 25)
            .attr("dy", ".35em")
            .attr("fill", d => d.color)
            .text(d => d.id.replace(/_/g, " "));

        simulation.nodes(data.nodes).on("tick", ticked);
        simulation.force("link").links(data.links);

        function ticked() {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            node
                .attr("transform", d => `translate(${d.x},${d.y})`);
        }

        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        function handleMouseOver(event, d) {
            d3.select(this).select("circle")
                .attr("fill", d.color);
            
            link.style("stroke", l => (l.source === d || l.target === d) ? d.color : "#475569")
                .style("stroke-width", l => (l.source === d || l.target === d) ? 3 : 1)
                .style("stroke-opacity", l => (l.source === d || l.target === d) ? 1 : 0.2);

            const panel = document.getElementById("info-panel");
            document.getElementById("info-title").innerText = d.id.replace(/_/g, " ");
            document.getElementById("info-title").style.color = d.color;
            document.getElementById("info-desc").innerText = d.desc;
            panel.style.opacity = 1;
        }

        function handleMouseOut(event, d) {
            d3.select(this).select("circle")
                .attr("fill", "#051114");
            
            link.style("stroke", "#475569")
                .style("stroke-width", d => Math.sqrt(d.value))
                .style("stroke-opacity", 0.6);

            document.getElementById("info-panel").style.opacity = 0;
        }

        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            svg.attr("width", width).attr("height", height);
            simulation.force("center", d3.forceCenter(width / 2, height / 2));
            simulation.alpha(0.3).restart();
        });
    </script>
</body>
</html>
