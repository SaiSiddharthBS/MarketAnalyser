# Agent Alpha - Institutional Configuration
# This file centralizes key parameters for the scoring and sizing logic.

thresholds:
  # Minimum scores to trigger an action
  buy_signal_score: 60
  sell_signal_score: 40
  strong_buy_score: 80
  strong_sell_score: 20

  # Volume requirements
  rvol_min: 1.2

position_sizing:
  # Base sizing rules
  max_portfolio_risk: 0.02 # Maximum 2% portfolio risk per trade
  max_position_size: 0.10  # Maximum 10% of portfolio in a single position
  default_kelly_fraction: 0.5 # Half-Kelly as base
