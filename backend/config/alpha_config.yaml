# ═══════════════════════════════════════════════════════════════
# AGENT ALPHA v2.0 — MASTER CONFIGURATION
# Single source of truth for ALL parameters, thresholds, weights.
# NO threshold is hardcoded anywhere else in the codebase.
# ═══════════════════════════════════════════════════════════════

# ─── Universe Tiers ──────────────────────────────────────────
universe:
  tier_1:
    description: "Nifty 50 — Full power, all 8 models active"
    min_avg_daily_volume_cr: 50     # ₹50 Cr+ daily turnover
    min_free_float_mcap_cr: 20000   # ₹20,000 Cr+ free float
    max_impact_cost_pct: 0.15
    all_models_active: true
    kelly_multiplier: 1.0
    max_position_pct: 10.0

  tier_2:
    description: "Nifty Next 50 — Full analysis, reduced sizing"
    min_avg_daily_volume_cr: 10
    min_free_float_mcap_cr: 5000
    max_impact_cost_pct: 0.5
    all_models_active: true
    kelly_multiplier: 0.7
    max_position_pct: 7.0

  tier_3:
    description: "Nifty Midcap Select — Selective, conservative"
    min_avg_daily_volume_cr: 2
    min_free_float_mcap_cr: 500
    max_impact_cost_pct: 1.5
    all_models_active: true
    kelly_multiplier: 0.4
    max_position_pct: 5.0

  hard_exclusions:
    - "stocks_under_sebi_investigation"
    - "stocks_with_trading_suspended_30d"
    - "stocks_with_promoter_pledging_veto"
    - "stocks_with_avg_daily_volume_below_1cr"
    - "penny_stocks_below_rs10"
    - "stocks_in_asm_esm_list"

# ─── Ensemble Model Weights ─────────────────────────────────
ensemble:
  model_weights:
    momentum:          0.20   # Model 1: Refined Momentum/Trend
    order_flow:        0.15   # Model 2: Order Flow Imbalance
    options_implied:   0.15   # Model 3: Options-Implied Intelligence
    sentiment:         0.10   # Model 4: News Sentiment NLP
    institutional:     0.15   # Model 5: FII/DII Flow
    volume_profile:    0.10   # Model 6: Volume & Microstructure
    seasonal:          0.05   # Model 7: Calendar/Seasonal Effects
    insider:           0.10   # Model 8: Insider/SAST Activity

  signal_thresholds:
    ultra_high_conviction:
      min_buy_votes: 5
      min_ensemble_score: 70
      kelly_multiplier: 1.5      # Up to 1.5× half-Kelly
    high_conviction:
      min_buy_votes: 4
      min_ensemble_score: 55
      kelly_multiplier: 1.0      # Full half-Kelly
    moderate:
      min_buy_votes: 3
      min_ensemble_score: 40
      kelly_multiplier: 0.5      # Half of half-Kelly
    stand_aside:
      max_buy_votes: 1
      max_ensemble_score: 20

# ─── Technical Analysis Parameters ──────────────────────────
technical:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2.0
  ema_short: 20
  ema_medium: 50
  ema_long: 200
  atr_period: 14
  adx_period: 14
  adx_trend_threshold: 25       # ADX > 25 = trending, momentum valid
  adx_chop_threshold: 20        # ADX < 20 = choppy, suppress momentum

  # Adaptive EMA: period = base_period × (1 + atr_ratio × scale)
  adaptive_ema:
    enabled: true
    atr_scale: 0.5              # How much ATR affects EMA period
    min_period_multiplier: 0.7
    max_period_multiplier: 1.5

  # RSI Divergence Detection
  divergence:
    lookback_periods: 14
    min_price_swing_pct: 2.0    # Minimum swing to qualify

  # Scoring weights (out of 100)
  score_weights:
    trend: 25
    volume: 20
    rsi: 15
    sector: 15
    regime: 15
    risk_reward: 10

# ─── Regime Detection ────────────────────────────────────────
regime:
  hmm_states: 4
  hmm_min_training_years: 5
  hmm_covariance_type: "full"
  hmm_n_iter: 1000
  smoothing_window: 3           # 3-day persistence rule

  # State definitions
  states:
    low_vol_uptrend:            # State 1 — HOME TURF
      vix_max: 15
      nifty_above_200ema: true
      ad_ratio_min: 1.2
      kelly_multiplier: 1.0
      stop_loss_atr_multiple: 1.5
      expected_win_rate: 0.70

    high_vol_uptrend:           # State 2 — CAUTIOUS BULL
      vix_range: [15, 25]
      nifty_above_200ema: true
      kelly_multiplier: 0.6
      stop_loss_atr_multiple: 2.0
      min_signal_level: "high_conviction"
      expected_win_rate: 0.60

    low_vol_chop:               # State 3 — STAND ASIDE
      vix_max: 15
      nifty_near_50ema: true    # Oscillating around 50 EMA
      ad_ratio_range: [0.9, 1.1]
      suppress_momentum: true
      kelly_multiplier: 0.3
      expected_win_rate: 0.40

    crisis:                     # State 4 — SURVIVAL MODE
      vix_min: 25
      nifty_below_200ema: true
      veto_all_buys: true
      kelly_multiplier: 0.0    # No new longs
      stop_loss_atr_multiple: 1.0
      # Exception: VIX > 35 + rapid spike = potential contrarian
      contrarian_vix_threshold: 35
      contrarian_min_model_agreement: 5

  # VIX Analysis
  vix:
    spike_threshold_5d_pct: 20    # VIX +20% in 5 days = regime transition
    extreme_high: 30              # VIX > 30 = crisis territory
    panic_level: 40               # VIX > 40 = liquidate to cash
    mean_reversion_signal: 30     # VIX > 30 AND declining = scale back in

  # F&O Expiry
  expiry:
    max_pain_gravity_days: 3      # Last 3 days before expiry
    post_expiry_range_multiplier: 1.5  # Widen range on expiry+1

# ─── FII/DII Flow Parameters ────────────────────────────────
fii_dii:
  rolling_windows: [5, 20]
  consecutive_days_strong: 3
  cumulative_5d_threshold_cr: 2000   # ₹2000 Cr = strong signal
  mass_selling_veto_cr: 5000         # ₹5000 Cr single-day sell = VETO ALL BUYS
  mass_selling_veto_duration_days: 2
  # Scoring
  net_positive_3d_score: 2
  net_negative_3d_score: -2
  consensus_divergence_confidence_reduction: 0.30  # 30% reduction

# ─── Options Parameters ─────────────────────────────────────
options:
  # PCR interpretation
  pcr_oversold: 1.5
  pcr_overbought: 0.7
  pcr_neutral_range: [0.8, 1.2]
  pcr_capitulation: 2.0
  pcr_euphoria: 0.5
  # Range prediction
  options_range_weight: 0.6
  garch_range_weight: 0.4

# ─── Shareholding & Pledging ────────────────────────────────
shareholding:
  promoter_pledging_veto_pct: 40        # > 40% pledging = VETO
  promoter_pledging_increase_veto_pct: 10  # +10% in single quarter = VETO 2 quarters
  institutional_accumulation_bonus: 5    # FII + MF both increasing = +5 score

# ─── Delivery Percentage ────────────────────────────────────
delivery:
  high_conviction_pct: 65    # > 65% = +2 points
  neutral_range: [40, 65]    # 40-65% = 0
  speculative_pct: 25        # < 25% = -1 point

# ─── Bulk/Block Deals ───────────────────────────────────────
bulk_deals:
  min_equity_pct: 0.5        # > 0.5% of equity in single session
  institutional_buy_bonus: 3  # +3 score for 3 days
  promoter_sell_penalty: -3

# ─── Pre-Market Intelligence ────────────────────────────────
premarket:
  sgx_gap_bullish_pct: 0.5
  sgx_gap_strong_bullish_pct: 1.5
  sgx_gap_bearish_pct: -0.5
  sgx_gap_strong_bearish_pct: -1.5
  sgx_gap_veto_pct: -1.5        # Gap down > 1.5% = suppress buys
  usdinr_depreciation_threshold_pct: 0.5  # INR -0.5% = FII pressure
  range_widen_multiplier: 0.5   # Widen by 0.5× ATR on strong gap

# ─── Macro Calendar ─────────────────────────────────────────
macro:
  suppression_levels:
    very_high:
      days_1: 0.0    # No new positions day before Budget/major RBI
      days_3: 0.3
    high:
      days_1: 0.4
      days_3: 0.7
    medium:
      days_1: 0.7

# ─── Sentiment (VADER + Financial Lexicon) ───────────────────
sentiment:
  model: "vader_financial"   # VADER + custom Indian financial lexicon
  recency_weight_decay: 0.85  # Recent news weighted 85% more
  strong_negative_threshold: -0.5
  strong_positive_threshold: 0.5
  sector_suppression_negative_pct: 70  # > 70% negative → suppress sector

# ─── Seasonal Patterns (Empirical from NSE 15yr data) ───────
seasonal:
  month_effects:
    1: 1.2    # January: FII allocation
    2: -0.8   # February: Budget uncertainty
    3: -1.5   # March: Tax-loss selling
    4: 1.8    # April: New FY buying
    5: 0.5
    6: -0.9   # June: Global summer illiquidity
    7: -0.6
    8: 0.8    # August: Monsoon + Q1 results
    9: -1.1   # September: US fiscal year-end
    10: 1.5   # October: Diwali effect
    11: 1.9   # November: Year-end rally
    12: 2.1   # December: Santa rally + window dressing
  day_effects:
    0: -0.3   # Monday
    1: 0.2    # Tuesday
    2: 0.1    # Wednesday
    3: 0.3    # Thursday (Expiry day)
    4: -0.4   # Friday

# ─── Position Sizing & Risk ─────────────────────────────────
risk:
  # Kelly Criterion
  kelly_fraction: 0.5           # Use half-Kelly (safer)
  max_single_position_pct: 10.0
  ultra_conviction_max_pct: 15.0
  capital_preservation_drawdown_pct: 15.0  # > 15% DD → 0.3× Kelly
  capital_preservation_kelly_multiplier: 0.3

  # CVaR
  cvar_confidence: 0.95
  max_cvar_per_position_pct: 2.0  # No position > 2% CVaR at 95%
  max_portfolio_cvar_pct: 3.0     # Portfolio CVaR daily cap

  # Stop Loss
  primary_stop_atr_multiplier: 1.5
  trailing_stop_breakeven_atr: 1.0   # Move to breakeven at +1 ATR
  trailing_stop_trail_atr: 2.0       # Trail at -1 ATR after +2 ATR
  time_stop_days: 5                  # Exit if < 1% move in 5 days
  time_stop_threshold_pct: 1.0

  # Impact Cost Filter
  min_edge_over_cost_multiplier: 2.0  # Only trade if edge > 2× cost

  # Portfolio Constraints
  max_portfolio_positions: 20
  max_correlation_between_positions: 0.65
  max_stocks_per_sector: 3
  max_sector_allocation_pct: 25.0
  max_portfolio_beta: 1.5      # Hard limit
  target_beta_by_regime:
    low_vol_uptrend: [0.9, 1.2]
    high_vol_uptrend: [0.6, 0.9]
    low_vol_chop: [0.0, 0.3]
    crisis: [-0.1, 0.0]        # Net short or cash

# ─── Hard Vetoes (ABSOLUTE — Cannot be overridden) ──────────
vetoes:
  block_buy_signals:
    - "promoter_pledging_above_40_and_increasing"
    - "earnings_within_3_trading_days"
    - "fii_net_selling_above_5000cr_previous_day"
    - "stock_hit_lower_circuit_in_10_days"
    - "sebi_investigation_flag"
    - "premarket_sgx_gap_down_above_1.5_pct"
    - "regime_state_4_crisis"
    - "vix_risen_above_30_pct_in_5_days"

  auto_exit_all:
    - "portfolio_drawdown_above_20_pct"
    - "vix_above_40"
    - "market_wide_circuit_breaker"

  earnings_blackout:
    reduce_position_days_before: 5
    reduce_position_factor: 0.5
    exit_completely_days_before: 1
    re_entry_days_after: 2

# ─── Alpha Decay Monitor ────────────────────────────────────
alpha_decay:
  lookback_days: 60
  decay_threshold_absolute: 0.08   # 8% drop = downweight
  suspend_threshold_absolute: 0.15  # 15% drop = suspend signal
  check_frequency: "weekly"

# ─── Momentum Crash Protection ──────────────────────────────
momentum_crash:
  crowding_52w_high_pct: 0.45      # > 45% near 52w high = crowded
  vol_compression_ratio: 0.5
  valuation_spread_extreme: 3.0     # Momentum PE / Value PE > 3
  dispersion_percentile: 10         # Below 10th percentile = low
  risk_thresholds:
    normal: [0, 30]
    reduce_20pct: [30, 50]
    reduce_50pct: [50, 70]
    suspend: [70, 100]

# ─── Credit Rating Actions ──────────────────────────────────
credit_ratings:
  significant_downgrade_steps: 2    # 2+ steps down = HARD VETO 90 days
  minor_downgrade_penalty: -8
  significant_upgrade_bonus: 5
  negative_watch_penalty: -4
  veto_duration_days: 90

# ─── Intermarket Relationships ───────────────────────────────
intermarket:
  crude_oil_sectors:
    OMC: -0.4        # Crude up 5% → -2 adjustment
    AVIATION: -0.5
    PAINTS: -0.25
    CHEMICALS: -0.2
  metal_sectors:
    METALS: 0.3
  currency_sectors:
    IT: 0.6           # INR depreciation boosts IT revenue
    PHARMA: 0.4
  yield_sectors:
    BANKS: -50         # 10 bps yield rise = -0.5 adjustment
    REALESTATE: -80
    NBFC: -40
  adjustment_cap: 5    # Max ±5 points

# ─── ML Engine ───────────────────────────────────────────────
ml:
  model: "lightgbm"
  n_estimators: 1000
  learning_rate: 0.02
  max_depth: 6
  min_child_samples: 50
  subsample: 0.8
  colsample_bytree: 0.7
  class_weight: "balanced"
  cv_splits: 10
  cv_gap: 5                      # 5-day gap to prevent leakage
  training_window_years: 3
  retrain_frequency: "monthly"
  target_horizon_days: 5
  target_return_pct: 2.0         # +2% = class 1, -2% = class -1

# ─── Backtest Parameters ─────────────────────────────────────
backtest:
  execution_price: "next_day_open"   # NOT signal-day close
  slippage_pct: 0.1                  # 0.1% slippage
  brokerage_pct: 0.03                # 0.03% per side
  stt_pct: 0.1                       # STT on sell side
  exchange_fees_pct: 0.003
  round_trip_cost_pct: 0.35          # Total estimated round-trip

# ─── Stress Test Scenarios ────────────────────────────────────
stress_tests:
  - name: "2008 Global Financial Crisis"
    start: "2008-01-01"
    end: "2009-03-31"
    max_drawdown_pass: 0.25
  - name: "2013 Taper Tantrum"
    start: "2013-05-01"
    end: "2013-09-30"
    max_drawdown_pass: 0.12
  - name: "2015 China Crash"
    start: "2015-06-01"
    end: "2015-10-31"
    max_drawdown_pass: 0.10
  - name: "2016 Demonetisation"
    start: "2016-11-08"
    end: "2017-01-31"
    max_drawdown_pass: 0.15
  - name: "2018 IL&FS Crisis"
    start: "2018-09-01"
    end: "2019-01-31"
    max_drawdown_pass: 0.12
  - name: "2020 COVID Crash"
    start: "2020-02-20"
    end: "2020-04-30"
    max_drawdown_pass: 0.20
  - name: "2022 Rate Hike Selloff"
    start: "2022-01-01"
    end: "2022-06-30"
    max_drawdown_pass: 0.15

# ─── Performance Benchmarks ──────────────────────────────────
benchmarks:
  minimum:
    directional_win_rate_state1: 0.65
    directional_win_rate_all: 0.58
    range_prediction_accuracy: 0.75
    sharpe_ratio: 1.5
    sortino_ratio: 2.0
    max_drawdown: 0.20
    win_loss_ratio: 1.8
    profit_factor: 1.5
  elite:
    directional_win_rate_state1: 0.72
    directional_win_rate_all: 0.65
    range_prediction_accuracy: 0.82
    sharpe_ratio: 2.5
    sortino_ratio: 3.5
    max_drawdown: 0.12
    win_loss_ratio: 2.5
    profit_factor: 2.2

# ─── System Health Monitor ───────────────────────────────────
health:
  db_response_timeout_ms: 100
  data_staleness_max_hours: 24
  min_models_healthy: 6          # At least 6/8 models must produce valid output
  ensemble_score_sanity_range: [0, 100]
  degraded_mode_signal: "SYSTEM DEGRADED — STAND ASIDE"

# ─── Data Pipeline Schedule ─────────────────────────────────
schedule:
  premarket_data: "06:00 IST"
  premarket_regime: "08:00 IST"
  market_open: "09:15 IST"
  eod_data: "15:35 IST"
  fii_dii_data: "16:00 IST"
  delivery_data: "16:30 IST"
  signal_generation: "17:00 IST"
  ml_ensemble: "17:30 IST"
  report_generation: "18:00 IST"
  alpha_decay_check: "19:00 IST"
  weekly_validation: "Sunday 20:00 IST"
