<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- Background -->
  <rect width="1280" height="640" fill="#051114"/>
  
  <!-- Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 255, 136, 0.05)" stroke-width="1"/>
  </pattern>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Techy accents -->
  <path d="M 0 540 L 100 540 L 120 520 L 1280 520" fill="none" stroke="#00FF88" stroke-width="2" opacity="0.5"/>
  <path d="M 0 550 L 80 550 L 100 530 L 1280 530" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
  <circle cx="100" cy="540" r="4" fill="#00FF88"/>
  <circle cx="80" cy="550" r="3" fill="#38bdf8"/>

  <!-- Top accents -->
  <path d="M 1280 100 L 1180 100 L 1160 120 L 0 120" fill="none" stroke="#ff3366" stroke-width="2" opacity="0.5"/>
  <circle cx="1180" cy="100" r="4" fill="#ff3366"/>

  <!-- Logo (Abstract representation) -->
  <g transform="translate(640, 220)">
    <!-- Outer hexagon -->
    <path d="M 0 -60 L 52 -30 L 52 30 L 0 60 L -52 30 L -52 -30 Z" fill="none" stroke="#00FF88" stroke-width="4"/>
    <!-- Inner hexagon -->
    <path d="M 0 -40 L 35 -20 L 35 20 L 0 40 L -35 20 L -35 -20 Z" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <!-- Core -->
    <circle cx="0" cy="0" r="15" fill="#00FF88" opacity="0.8"/>
    <!-- Rays -->
    <line x1="0" y1="-60" x2="0" y2="-80" stroke="#00FF88" stroke-width="2"/>
    <line x1="0" y1="60" x2="0" y2="80" stroke="#00FF88" stroke-width="2"/>
    <line x1="52" y1="-30" x2="69" y2="-40" stroke="#00FF88" stroke-width="2"/>
    <line x1="-52" y1="30" x2="-69" y2="40" stroke="#00FF88" stroke-width="2"/>
    <line x1="52" y1="30" x2="69" y2="40" stroke="#00FF88" stroke-width="2"/>
    <line x1="-52" y1="-30" x2="-69" y2="-40" stroke="#00FF88" stroke-width="2"/>
  </g>

  <!-- Title Text -->
  <text x="640" y="380" font-family="'Courier New', Courier, monospace" font-size="72" font-weight="900" fill="#00FF88" text-anchor="middle" letter-spacing="8">AGENT ALPHA</text>
  
  <!-- Subtitle -->
  <text x="640" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#a0aec0" text-anchor="middle" letter-spacing="2">AUTONOMOUS 15-MODEL ENSEMBLE ENGINE</text>
  
  <!-- Badges simulation -->
  <g transform="translate(640, 480)">
    <rect x="-100" y="0" width="80" height="24" rx="4" fill="#00FF88" opacity="0.1"/>
    <text x="-60" y="16" font-family="-apple-system, sans-serif" font-size="12" fill="#00FF88" text-anchor="middle" font-weight="bold">L I V E</text>
    
    <rect x="0" y="0" width="100" height="24" rx="4" fill="#38bdf8" opacity="0.1"/>
    <text x="50" y="16" font-family="-apple-system, sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="bold">Q U A N T</text>
  </g>
</svg>
